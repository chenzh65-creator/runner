<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>末日突围：生化围城 3D (复活系统版)</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #110814;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    #vignette {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8), inset 0 0 40px rgba(255, 30, 0, 0.25);
      z-index: 5;
    }

    /* 顶部 HUD */
    #hud {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 16px;
      display: flex; gap: 8px; z-index: 10;
    }
    .hud-card {
      background: rgba(18, 10, 24, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 80, 80, 0.4); padding: 8px 12px;
      border-radius: 8px; font-weight: 800; font-size: 13px; color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); display: flex; align-items: center;
    }
    .hud-card span { color: #00ffcc; font-size: 16px; margin-left: 4px; }
    #life-card span { color: #ff3366; font-size: 16px; }

    .top-btns {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px;
      display: flex; gap: 8px; z-index: 12;
    }
    .top-btn {
      background: rgba(255, 170, 0, 0.9); color: #000; border: none;
      padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 12px;
      cursor: pointer; box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
    }
    #btn-music { background: rgba(0, 230, 255, 0.9); box-shadow: 0 0 12px rgba(0, 230, 255, 0.4); }

    /* 里程碑奖励横幅 */
    #milestone-banner {
      display: none; position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.95), rgba(0, 150, 80, 0.95));
      color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 17px; font-weight: 900;
      box-shadow: 0 0 30px rgba(0, 255, 150, 0.7); z-index: 15; white-space: nowrap;
      animation: alertBounce 0.4s infinite alternate;
    }

    #turn-alert {
      display: none; position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255, 17, 68, 0.92); color: #fff; padding: 12px 26px; border-radius: 30px;
      font-size: 18px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 10px #000;
      box-shadow: 0 0 30px #ff1144; z-index: 15; white-space: nowrap;
      animation: alertBounce 0.4s infinite alternate;
    }
    @keyframes alertBounce { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.08); } }

    /* 复活确认面板 */
    #revive-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #fff; text-align: center;
      background: rgba(18, 8, 20, 0.96); backdrop-filter: blur(20px);
      padding: 26px 30px; border-radius: 16px; border: 2px solid #00ffcc;
      box-shadow: 0 0 50px rgba(0, 255, 204, 0.5); z-index: 25; width: 88vw; max-width: 340px;
    }
    #revive-modal h2 { margin: 0 0 8px 0; color: #00ffcc; font-size: 22px; }
    #revive-btn {
      margin-top: 15px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
      color: #000; background: #00ffcc; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
    }

    #controls-hint {
      position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      background: rgba(18, 10, 24, 0.85); backdrop-filter: blur(8px);
      padding: 6px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
      color: #ccc; font-size: 12px; z-index: 10; white-space: nowrap; pointer-events: none;
    }
    #controls-hint b { color: #00ffcc; }

    /* 结算弹窗 */
    #gameover {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #fff; text-align: center;
      background: rgba(18, 8, 20, 0.96); backdrop-filter: blur(20px);
      padding: 26px 32px; border-radius: 16px; border: 2px solid #ff3333;
      box-shadow: 0 0 50px rgba(255, 30, 30, 0.6); z-index: 20;
      width: 88vw; max-width: 360px;
    }
    #gameover h1 { margin: 0 0 8px 0; color: #ff3333; font-size: 26px; }
    #gameover p { margin: 4px 0; color: #aaa; font-size: 14px; }
    #gameover span { color: #fff; font-weight: bold; }

    .submit-box { margin-top: 14px; display: flex; gap: 6px; justify-content: center; }
    .submit-box input {
      background: #25142a; border: 1px solid #ff5555; color: #fff; padding: 8px 10px;
      border-radius: 6px; font-size: 14px; outline: none; width: 55%; text-align: center;
    }
    .submit-box button {
      background: #00e676; color: #000; border: none; padding: 8px 14px;
      border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
    }

    .gameover-btns { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
    .btn-restart {
      flex: 1; padding: 10px 0; font-size: 14px; font-weight: bold;
      color: #fff; background: linear-gradient(135deg, #ff3333, #990000);
      border: none; border-radius: 8px; cursor: pointer;
    }
    .btn-view-rank {
      flex: 1; padding: 10px 0; font-size: 14px; font-weight: bold;
      color: #fff; background: #3c2445; border: none; border-radius: 8px; cursor: pointer;
    }

    /* 排行榜弹窗 */
    #leaderboard-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #fff;
      background: rgba(18, 10, 24, 0.98); backdrop-filter: blur(20px);
      padding: 22px 20px; border-radius: 16px; border: 2px solid #ffaa00;
      box-shadow: 0 0 40px rgba(255, 170, 0, 0.4); z-index: 30;
      width: 90vw; max-width: 360px;
    }
    #leaderboard-modal h2 { margin: 0 0 12px 0; color: #ffaa00; text-align: center; font-size: 20px; }
    .rank-list { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow-y: auto; }
    .rank-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px;
    }
    .rank-item:nth-child(1) { color: #ffd700; font-weight: bold; }
    .rank-item:nth-child(2) { color: #c0c0c0; font-weight: bold; }
    .rank-item:nth-child(3) { color: #cd7f32; font-weight: bold; }
    .rank-close {
      margin-top: 15px; width: 100%; padding: 10px; background: #444; border: none;
      color: #fff; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="hud">
    <div class="hud-card" id="life-card">❤️ <span id="revive-text">1</span></div>
    <div class="hud-card">🏃 <span id="score-text">0</span> m</div>
    <div class="hud-card">💉 <span id="serum-text">0</span></div>
  </div>
  <div class="top-btns">
    <button id="btn-music" class="top-btn" onclick="toggleMusic()">🎵 音乐:开</button>
    <button id="btn-open-rank" class="top-btn" onclick="openLeaderboard()">🏆 榜单</button>
  </div>

  <div id="milestone-banner">🎉 突破 <span id="milestone-m">1000</span>m！肾上腺素+1 ❤️</div>
  <div id="turn-alert">◀ 准备向左拐弯</div>

  <!-- 原地复活弹窗 -->
  <div id="revive-modal">
    <h2>💉 肾上腺素救护</h2>
    <p>检测到致命伤！剩余复活机会: <span id="modal-revive-count">1</span></p>
    <button id="revive-btn" onclick="useRevive()">立即复活 (3s 无敌保护)</button>
  </div>

  <div id="controls-hint">
    <b>滑动手势 / 键盘</b>：A/D换道 ｜ W跳跃 ｜ S下滑钻过激光
  </div>

  <div id="gameover">
    <h1 id="over-reason">丧尸扑杀撕碎</h1>
    <p>逃亡生存距离: <span id="final-dist">0</span> m</p>
    <p>搜集生化血清: <span id="final-serum">0</span> 支</p>

    <div class="submit-box" id="submit-box">
      <input type="text" id="player-name" placeholder="幸存者昵称" maxlength="6" value="突围者">
      <button onclick="submitScoreToCloud()">上传战绩</button>
    </div>
    <div id="submit-tip" style="font-size: 11px; color: #00ffcc; margin-top: 6px;"></div>

    <div class="gameover-btns">
      <button class="btn-restart" onclick="location.reload()">重新突围</button>
      <button class="btn-view-rank" onclick="openLeaderboard()">天梯榜</button>
    </div>
  </div>

  <div id="leaderboard-modal">
    <h2>🏆 全球突围幸存者榜</h2>
    <ul class="rank-list" id="rank-list">
      <li class="rank-item"><span>加载中...</span></li>
    </ul>
    <button class="rank-close" onclick="closeLeaderboard()">关闭</button>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ----------------- 0. 全球排行榜存储 -----------------
    const LOCAL_KEY = 'templerun_global_leaderboard';
    let cachedLeaderboard = [
      { name: '特战幽灵', score: 1450 },
      { name: '曙光卫士', score: 1120 },
      { name: '生化先锋', score: 860 },
      { name: '废土狂徒', score: 620 },
      { name: '黎明猎手', score: 410 }
    ];

    try {
      const localData = localStorage.getItem(LOCAL_KEY);
      if (localData) cachedLeaderboard = JSON.parse(localData);
    } catch (e) {}

    async function fetchCloudLeaderboard() {
      try {
        const res = await fetch(`https://kvdb.io/4yH2nU5C5F6yY7yJ6eGk7p/global_rankings?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            cachedLeaderboard = data;
            localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
          }
        }
      } catch (e) {}
      renderLeaderboardUI();
    }

    async function submitScoreToCloud() {
      const nameInput = document.getElementById('player-name');
      const name = nameInput.value.trim() || '匿名幸存者';
      const score = Math.floor(distance);
      const tip = document.getElementById('submit-tip');
      tip.innerText = '正在上传云端...';

      cachedLeaderboard.push({ name: name, score: score });
      cachedLeaderboard.sort((a, b) => b.score - a.score);
      cachedLeaderboard = cachedLeaderboard.slice(0, 10);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(cachedLeaderboard));

      try {
        await fetch('https://kvdb.io/4yH2nU5C5F6yY7yJ6eGk7p/global_rankings', {
          method: 'POST', body: JSON.stringify(cachedLeaderboard),
          headers: { 'Content-Type': 'application/json' }
        });
        tip.innerText = '✅ 上传成功！已载入天梯榜';
      } catch (e) {
        tip.innerText = '✅ 已收录至本地排行榜';
      }
      document.getElementById('submit-box').style.display = 'none';
      renderLeaderboardUI();
    }

    function renderLeaderboardUI() {
      const list = document.getElementById('rank-list');
      list.innerHTML = '';
      cachedLeaderboard.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'rank-item';
        const rankIcon = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : `#${index + 1} `));
        li.innerHTML = `<span>${rankIcon}<b>${item.name}</b></span><span>${item.score} m</span>`;
        list.appendChild(li);
      });
    }

    function openLeaderboard() {
      document.getElementById('leaderboard-modal').style.display = 'block';
      fetchCloudLeaderboard();
    }
    function closeLeaderboard() {
      document.getElementById('leaderboard-modal').style.display = 'none';
    }

    // ----------------- 1. Web Audio 原生末日电子合成音乐引擎 -----------------
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isMusicEnabled = true;
    let bgmTimer = null;
    let bgmStep = 0;
    const BASS_NOTES = [41.2, 41.2, 49.0, 41.2, 43.65, 41.2, 55.0, 49.0];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        startBGM();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleMusic() {
      isMusicEnabled = !isMusicEnabled;
      document.getElementById('btn-music').innerText = isMusicEnabled ? '🎵 音乐:开' : '🔇 音乐:关';
      if (!isMusicEnabled && audioCtx) {
        if (bgmTimer) clearInterval(bgmTimer);
      } else if (isMusicEnabled) {
        initAudio();
        startBGM();
      }
    }

    function startBGM() {
      if (bgmTimer) clearInterval(bgmTimer);
      bgmTimer = setInterval(() => {
        if (!isMusicEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;

        if (bgmStep % 2 === 0) {
          const kickOsc = audioCtx.createOscillator();
          const kickGain = audioCtx.createGain();
          kickOsc.connect(kickGain); kickGain.connect(audioCtx.destination);
          kickOsc.frequency.setValueAtTime(110, now);
          kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
          kickGain.gain.setValueAtTime(0.35, now);
          kickGain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          kickOsc.start(now); kickOsc.stop(now + 0.12);
        }

        const noteFreq = BASS_NOTES[bgmStep % BASS_NOTES.length];
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.setValueAtTime(450, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + 0.18);

        bassOsc.type = 'sawtooth';
        bassOsc.frequency.setValueAtTime(noteFreq * 2, now);
        bassOsc.connect(filter); filter.connect(bassGain);
        bassGain.connect(audioCtx.destination);

        bassGain.gain.setValueAtTime(0.12, now);
        bassGain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        bassOsc.start(now); bassOsc.stop(now + 0.18);

        bgmStep++;
      }, 150);
    }

    function playSfx(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.14);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      } else if (type === 'slide') {
        const bufferSize = audioCtx.sampleRate * 0.22;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600;
        noise.connect(filter); filter.connect(gain);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        noise.start(now);
      } else if (type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'revive_reward') {
        // 获得复活币的清脆和弦音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      } else if (type === 'revive_use') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      } else if (type === 'drift') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(160, now + 0.3);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // ----------------- 2. 程序化高精贴图 -----------------
    function createBuildingTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 512;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#1e1424'; ctx.fillRect(0, 0, 256, 512);
      for (let y = 20; y < 500; y += 30) {
        for (let x = 20; x < 240; x += 35) {
          if (Math.random() > 0.65) {
            ctx.fillStyle = Math.random() > 0.4 ? '#ff9900' : '#00e5ff';
            ctx.fillRect(x, y, 20, 18);
          } else {
            ctx.fillStyle = '#0f0812';
            ctx.fillRect(x, y, 20, 18);
          }
        }
      }
      return new THREE.CanvasTexture(cvs);
    }

    function createRoadTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 1024;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#221e28'; ctx.fillRect(0, 0, 512, 1024);
      for (let i = 0; i < 5000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#2c2734' : '#19151e';
        ctx.fillRect(Math.random() * 512, Math.random() * 1024, 2, 2);
      }
      ctx.fillStyle = '#ff3300';
      for (let y = 0; y < 1024; y += 64) {
        ctx.fillRect(0, y, 28, 32); ctx.fillRect(512 - 28, y, 28, 32);
      }
      ctx.fillStyle = '#00f5d4';
      for (let y = 30; y < 1024; y += 128) {
        ctx.fillRect(170 - 4, y, 8, 64); ctx.fillRect(342 - 4, y, 8, 64);
      }
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createArrowTexture(isLeft = true) {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 256;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0)'; ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 3; i++) {
        const offset = i * 70;
        ctx.beginPath();
        if (isLeft) {
          const startX = 210 - offset;
          ctx.moveTo(startX, 50); ctx.lineTo(startX - 60, 128); ctx.lineTo(startX, 206);
          ctx.lineTo(startX - 30, 206); ctx.lineTo(startX - 90, 128); ctx.lineTo(startX - 30, 50);
        } else {
          const startX = 46 + offset;
          ctx.moveTo(startX, 50); ctx.lineTo(startX + 60, 128); ctx.lineTo(startX, 206);
          ctx.lineTo(startX + 30, 206); ctx.lineTo(startX + 90, 128); ctx.lineTo(startX + 30, 50);
        }
        ctx.closePath();
        ctx.fillStyle = i === 2 ? '#ffff00' : (i === 1 ? '#ff7700' : '#ff0044');
        ctx.fill();
      }
      return new THREE.CanvasTexture(cvs);
    }

    function createHazardTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 128; cvs.height = 32;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#ffaa00'; ctx.fillRect(0, 0, 128, 32);
      ctx.fillStyle = '#111';
      for (let x = -32; x < 128 + 32; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x + 10, 0); ctx.lineTo(x - 5, 32); ctx.lineTo(x - 15, 32);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 1);
      return tex;
    }

    // ----------------- 3. 场景与全局光影 -----------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0d20);
    scene.fog = new THREE.FogExp2(0x24122d, 0.012);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x4a2845, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xff6633, 1.1);
    sunLight.position.set(30, 50, -20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    scene.add(sunLight);

    const coldRimLight = new THREE.DirectionalLight(0x00d0ff, 0.5);
    coldRimLight.position.set(-20, 20, 20);
    scene.add(coldRimLight);

    const sparkCount = 30;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPositions = new Float32Array(sparkCount * 3);
    for (let i = 0; i < sparkCount * 3; i++) sparkPositions[i] = 0;
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.22, transparent: true, opacity: 0 });
    const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
    scene.add(sparkSystem);

    // ----------------- 4. 难度与复活机制配置 -----------------
    const DIFFICULTY = {
      baseSpeed: 0.20,
      maxSpeed: 0.50,
      laserUnlockDist: 400,
      turnUnlockDist: 800
    };

    let distance = 0;
    let speed = DIFFICULTY.baseSpeed;
    let reviveCount = 1; // 初始自带 1 次复活
    let nextMilestone = 1000; // 每1000米增加一次
    let isInvincible = false; // 复活无敌保护中
    let invincibleTimer = 0;
    let isWaitingRevive = false;

    const LANES = [-2.4, 0, 2.4];
    let currentLane = 1;
    let isJumping = false;
    let isSliding = false;
    let isFalling = false;
    let slideTimer = 0;
    let jumpVelocity = 0;
    const gravity = -0.016;

    // --- 角色模型装配 ---
    const playerGroup = new THREE.Group();
    const matArmor = new THREE.MeshStandardMaterial({ color: 0x1f232a, roughness: 0.4, metalness: 0.5 });
    const matSuit = new THREE.MeshStandardMaterial({ color: 0x334d5c, roughness: 0.7 });
    const matGloves = new THREE.MeshStandardMaterial({ color: 0x111215, roughness: 0.3 });
    const matVisorGlow = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
    const matStrap = new THREE.MeshStandardMaterial({ color: 0xff4500, roughness: 0.5 });

    const pTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.28, 0.95, 8), matSuit);
    pTorso.position.y = 1.15; pTorso.castShadow = true;

    const vestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.65, 0.46), matArmor);
    pTorso.add(vestPlate);

    const chestStrap = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.48), matStrap);
    chestStrap.position.set(0, 0.1, 0.01); chestStrap.rotation.z = 0.4;
    pTorso.add(chestStrap);

    const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.6, 0.28), matArmor);
    backpack.position.set(0, 0.05, -0.32);
    const oxygenTank = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0xdfe6e9, metalness: 0.8 }));
    oxygenTank.position.set(0.16, 0, -0.16);
    backpack.add(oxygenTank);
    pTorso.add(backpack);

    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 14), matArmor);
    pHead.position.set(0, 0.68, 0); pHead.castShadow = true;
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.16), matVisorGlow);
    visor.position.set(0, 0.02, 0.18);
    pHead.add(visor);
    const rebreather = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.15, 8), matGloves);
    rebreather.rotation.x = Math.PI / 2; rebreather.position.set(0, -0.12, 0.2);
    pHead.add(rebreather);
    pTorso.add(pHead);

    const chestSpotlight = new THREE.SpotLight(0xe0f7fa, 3.8, 40, Math.PI / 6, 0.35, 1);
    chestSpotlight.position.set(0, 0.2, 0.35);
    const flashTarget = new THREE.Object3D();
    flashTarget.position.set(0, 0, -18);
    playerGroup.add(flashTarget);
    chestSpotlight.target = flashTarget;
    pTorso.add(chestSpotlight);

    // 复活无敌防护盾网格
    const reviveShield = new THREE.Mesh(
      new THREE.SphereGeometry(1.4, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0 })
    );
    reviveShield.position.y = 1.0;
    playerGroup.add(reviveShield);

    function createTacticalLimb(uR, lR, len, matU, matL) {
      const joint = new THREE.Group();
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(uR, uR * 0.9, len, 8), matU);
      upper.position.y = -len / 2; upper.castShadow = true;
      joint.add(upper);

      const kneePad = new THREE.Mesh(new THREE.BoxGeometry(uR * 2.2, uR * 1.5, uR * 1.8), matArmor);
      kneePad.position.set(0, -len, 0.05);
      joint.add(kneePad);

      const lower = new THREE.Mesh(new THREE.CylinderGeometry(uR * 0.85, lR, len, 8), matL);
      lower.position.y = -len * 1.45; lower.castShadow = true;
      joint.add(lower);
      return joint;
    }

    const leftArm = createTacticalLimb(0.09, 0.07, 0.35, matSuit, matGloves);
    leftArm.position.set(-0.45, 1.48, 0);
    const rightArm = createTacticalLimb(0.09, 0.07, 0.35, matSuit, matGloves);
    rightArm.position.set(0.45, 1.48, 0);

    const leftLeg = createTacticalLimb(0.13, 0.1, 0.42, matSuit, matArmor);
    leftLeg.position.set(-0.2, 0.72, 0);
    const rightLeg = createTacticalLimb(0.13, 0.1, 0.42, matSuit, matArmor);
    rightLeg.position.set(0.2, 0.72, 0);

    playerGroup.add(pTorso, leftArm, rightArm, leftLeg, rightLeg);
    scene.add(playerGroup);

    // --- 变异暴君丧尸 ---
    const zombieGroup = new THREE.Group();
    const matZombieSkin = new THREE.MeshStandardMaterial({ color: 0x3e5239, roughness: 0.85 });
    const matZombieFlesh = new THREE.MeshBasicMaterial({ color: 0xff0033 });

    const zTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.38, 1.3, 8), matZombieSkin);
    zTorso.position.y = 1.35; zTorso.rotation.x = 0.35; zTorso.castShadow = true;

    const bioHeart = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22), matZombieFlesh);
    bioHeart.position.set(0.18, 0.2, 0.42);
    zTorso.add(bioHeart);

    const zHead = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), matZombieSkin);
    zHead.position.set(0, 0.8, 0.25);
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), matZombieFlesh);
    eyeL.position.set(-0.14, 0.08, 0.3);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.14;
    zHead.add(eyeL, eyeR);
    zTorso.add(zHead);

    const zLeftArm = createTacticalLimb(0.18, 0.14, 0.5, matZombieSkin, matZombieSkin);
    zLeftArm.position.set(-0.65, 1.6, 0.2); zLeftArm.rotation.x = -1.25;
    const zRightArm = createTacticalLimb(0.14, 0.11, 0.45, matZombieSkin, matZombieSkin);
    zRightArm.position.set(0.6, 1.6, 0.2); zRightArm.rotation.x = -1.25;

    zombieGroup.add(zTorso, zLeftArm, zRightArm);
    scene.add(zombieGroup);

    // ----------------- 5. 地图与障碍系统 -----------------
    const TRACK_PIECE_LENGTH = 24;
    const TRACK_COUNT = 8;
    const tracks = [];
    const obstacles = [];
    const serums = [];
    const turnGlowMeshes = [];

    const buildingTex = createBuildingTexture();
    const roadTex = createRoadTexture();
    const hazardTex = createHazardTexture();
    const arrowLeftTex = createArrowTexture(true);
    const arrowRightTex = createArrowTexture(false);

    const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.8 });
    const bridgePierMat = new THREE.MeshStandardMaterial({ color: 0x1f1a24, roughness: 0.95 });
    const buildingMat = new THREE.MeshStandardMaterial({ map: buildingTex, roughness: 0.85 });
    const guardMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
    const laserMat = new THREE.MeshBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.85 });
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0xb52b2b, roughness: 0.5 });

    const turnTransition = {
      active: false,
      progress: 0,
      duration: 25,
      dir: 1,
      startCamYaw: 0,
      activeTrack: null
    };

    function createBarrelCluster(laneIdx, zPos) {
      const group = new THREE.Group();
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 1.25, 10), barrelMat);
      b1.position.set(0, 0.62, 0); b1.castShadow = true;
      group.add(b1);
      if (distance > 600 && Math.random() > 0.6) {
        const b2 = b1.clone();
        b2.position.set(0.45, 0.62, 0.3); b2.rotation.z = 0.25;
        group.add(b2);
      }
      group.position.set(LANES[laneIdx], 0, zPos);
      group.userData = { type: 'low_obs' };
      scene.add(group);
      obstacles.push(group);
    }

    function createHighLaserBeam(zPos) {
      const group = new THREE.Group();
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.5, 0.6), guardMat);
      p1.position.set(-3.8, 2.75, 0); p1.castShadow = true;
      const p2 = p1.clone(); p2.position.x = 3.8;
      const topBar = new THREE.Mesh(new THREE.BoxGeometry(8.2, 2.4, 0.9), new THREE.MeshStandardMaterial({ map: hazardTex }));
      topBar.position.set(0, 3.2, 0); topBar.castShadow = true;
      const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 7.6, 6), laserMat);
      laser.rotation.z = Math.PI / 2; laser.position.set(0, 1.6, 0);
      group.add(p1, p2, topBar, laser);
      group.position.set(0, 0, zPos);
      group.userData = { type: 'high_obs', laser: laser };
      scene.add(group);
      obstacles.push(group);
    }

    const serumTubeGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.65, 8);
    const serumLiquidMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });

    function createSerumItem(x, z) {
      const serum = new THREE.Mesh(serumTubeGeo, serumLiquidMat);
      serum.position.set(x, 0.8, z);
      scene.add(serum);
      serums.push(serum);
    }

    function createTrackPiece(zPos, forceTurn = false) {
      const group = new THREE.Group();
      let isTurn = forceTurn;
      let turnDir = Math.random() > 0.5 ? 1 : -1;

      if (isTurn) {
        const mainRoad = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, TRACK_PIECE_LENGTH), roadMat);
        mainRoad.position.set(0, -0.3, 0); group.add(mainRoad);

        const cross = new THREE.Mesh(new THREE.BoxGeometry(26, 0.6, 8), roadMat);
        cross.position.set(turnDir * 9, -0.3, 0); group.add(cross);

        const arrowPlaneMat = new THREE.MeshBasicMaterial({
          map: turnDir === -1 ? arrowLeftTex : arrowRightTex,
          transparent: true, opacity: 0.95
        });
        const arrowPlane = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 7.2), arrowPlaneMat);
        arrowPlane.rotation.x = -Math.PI / 2; arrowPlane.position.set(0, 0.04, 0);
        group.add(arrowPlane);
        turnGlowMeshes.push(arrowPlane);

        const signPost = new THREE.Mesh(new THREE.BoxGeometry(0.4, 7, 0.4), guardMat);
        signPost.position.set(-turnDir * 4.2, 3.5, 0);
        const signBoard = new THREE.Mesh(
          new THREE.BoxGeometry(4.5, 2.5, 0.4),
          new THREE.MeshBasicMaterial({ map: turnDir === -1 ? arrowLeftTex : arrowRightTex })
        );
        signBoard.position.set(-turnDir * 2.2, 6.0, 0);
        group.add(signPost, signBoard);
      } else {
        const road = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, TRACK_PIECE_LENGTH), roadMat);
        road.position.set(0, -0.3, 0); road.receiveShadow = true;
        group.add(road);

        const pier = new THREE.Mesh(new THREE.BoxGeometry(3.5, 20, 3.5), bridgePierMat);
        pier.position.set(0, -10.3, 0);
        group.add(pier);

        const guardL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.7, TRACK_PIECE_LENGTH), guardMat);
        guardL.position.set(-4.0, 0.15, 0);
        const guardR = guardL.clone(); guardR.position.x = 4.0;
        group.add(guardL, guardR);

        const bHeightL = 25 + Math.random() * 35;
        const bL = new THREE.Mesh(new THREE.BoxGeometry(16, bHeightL, 18), buildingMat);
        bL.position.set(-18 - Math.random() * 4, bHeightL / 2 - 12, 0);
        group.add(bL);

        const bHeightR = 25 + Math.random() * 35;
        const bR = new THREE.Mesh(new THREE.BoxGeometry(16, bHeightR, 18), buildingMat);
        bR.position.set(18 + Math.random() * 4, bHeightR / 2 - 12, 0);
        group.add(bR);
      }

      group.position.set(0, 0, zPos);
      group.userData = { isTurnTrack: isTurn, turnDir: turnDir, handled: false };
      scene.add(group);
      tracks.push(group);

      if (zPos < -30 && !isTurn) {
        const rand = Math.random();
        if (distance < DIFFICULTY.laserUnlockDist) {
          if (rand < 0.25) createBarrelCluster(Math.floor(Math.random() * 3), zPos);
          createSerumItem(LANES[Math.floor(Math.random() * 3)], zPos + 3);
        } else if (distance < DIFFICULTY.turnUnlockDist) {
          if (rand < 0.15) createHighLaserBeam(zPos);
          else if (rand < 0.45) {
            const l = Math.floor(Math.random() * 3);
            createBarrelCluster(l, zPos);
            createSerumItem(LANES[(l + 1) % 3], zPos + 3);
          }
        } else {
          if (rand < 0.25) createHighLaserBeam(zPos);
          else if (rand < 0.65) {
            const l = Math.floor(Math.random() * 3);
            createBarrelCluster(l, zPos);
            createSerumItem(LANES[(l + 1) % 3], zPos + 3);
          } else {
            createSerumItem(LANES[Math.floor(Math.random() * 3)], zPos + 4);
          }
        }
      }
    }

    for (let i = 0; i < TRACK_COUNT; i++) createTrackPiece(-i * TRACK_PIECE_LENGTH, false);

    // ----------------- 6. 交互响应 -----------------
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      initAudio();
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isFalling || isGameOver || turnTransition.active || isWaitingRevive) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const deltaY = e.changedTouches[0].screenY - touchStartY;
      const deltaTime = Date.now() - touchStartTime;

      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);

      if (Math.max(absX, absY) > 20 && deltaTime < 450) {
        if (absX > absY) {
          if (deltaX < 0) handleInput('left');
          else handleInput('right');
        } else {
          if (deltaY < 0) handleInput('up');
          else handleInput('down');
        }
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (isFalling || isGameOver || turnTransition.active || isWaitingRevive) return;
      const key = e.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') handleInput('left');
      else if (key === 'arrowright' || key === 'd') handleInput('right');
      else if (key === 'arrowup' || key === 'w' || key === ' ') handleInput('up');
      else if (key === 'arrowdown' || key === 's') handleInput('down');
    });

    function handleInput(action) {
      const nearTurnTrack = tracks.find(t => t.userData.isTurnTrack && Math.abs(t.position.z) < 8.0 && !t.userData.handled);

      if (action === 'left') {
        if (nearTurnTrack) {
          if (nearTurnTrack.userData.turnDir === -1) startSmoothTurn(nearTurnTrack, -1);
          else triggerTurnFail("反向转弯！坠入深渊！");
        } else if (currentLane > 0) currentLane--;
      } else if (action === 'right') {
        if (nearTurnTrack) {
          if (nearTurnTrack.userData.turnDir === 1) startSmoothTurn(nearTurnTrack, 1);
          else triggerTurnFail("反向转弯！坠入深渊！");
        } else if (currentLane < 2) currentLane++;
      } else if (action === 'up' && !isJumping && !isSliding) {
        isJumping = true; jumpVelocity = 0.34; playSfx('jump');
      } else if (action === 'down' && !isSliding) {
        isJumping = false; playerGroup.position.y = 0; isSliding = true; slideTimer = 55; playSfx('slide');
      }
    }

    function startSmoothTurn(track, dir) {
      track.userData.handled = true;
      playSfx('drift');
      document.getElementById('turn-alert').style.display = 'none';

      turnTransition.active = true;
      turnTransition.progress = 0;
      turnTransition.dir = dir;
      turnTransition.activeTrack = track;
      turnTransition.startCamYaw = camera.rotation.y;
    }

    function finishSmoothTurn() {
      turnTransition.active = false;
      currentLane = 1;
      playerGroup.position.x = 0;
      playerGroup.rotation.y = 0;
      playerGroup.rotation.z = 0;

      tracks.forEach(t => scene.remove(t));
      obstacles.forEach(o => scene.remove(o));
      serums.forEach(c => scene.remove(c));
      tracks.length = 0; obstacles.length = 0; serums.length = 0; turnGlowMeshes.length = 0;
      distanceSinceLastTurn = 0;

      sparkMat.opacity = 0;
      for (let i = 0; i < TRACK_COUNT; i++) createTrackPiece(-i * TRACK_PIECE_LENGTH, false);
    }

    function triggerTurnFail(reason) {
      isFalling = true;
      playSfx('hit');
      document.getElementById('turn-alert').style.display = 'none';
      handlePlayerDefeat(reason);
    }

    // ----------------- 7. 复活与结算控制中心 -----------------
    function handlePlayerDefeat(reason) {
      if (reviveCount > 0) {
        // 触发复活流程
        isWaitingRevive = true;
        document.getElementById('modal-revive-count').innerText = reviveCount;
        document.getElementById('revive-modal').style.display = 'block';
      } else {
        triggerGameOver(reason);
      }
    }

    function useRevive() {
      reviveCount--;
      document.getElementById('revive-text').innerText = reviveCount;
      document.getElementById('revive-modal').style.display = 'none';
      isWaitingRevive = false;
      isFalling = false;

      playSfx('revive_use');

      // 重置回安全状态
      currentLane = 1;
      playerGroup.position.set(0, 0, 0);
      playerGroup.rotation.set(0, 0, 0);
      isJumping = false;
      isSliding = false;
      jumpVelocity = 0;

      // 清除前方附近障碍物
      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (Math.abs(obstacles[i].position.z) < 25) {
          scene.remove(obstacles[i]);
          obstacles.splice(i, 1);
        }
      }

      // 开启 3 秒无敌金身保护
      isInvincible = true;
      invincibleTimer = 180; // 约 3 秒 (60fps)
      reviveShield.material.opacity = 0.8;
    }

    // ----------------- 8. 游戏渲染主循环 -----------------
    let serumCount = 0;
    let isGameOver = false;
    let distanceSinceLastTurn = 0;
    let animClock = 0;

    function animate() {
      if (isGameOver && !isFalling) return;
      requestAnimationFrame(animate);

      if (isWaitingRevive) {
        renderer.render(scene, camera);
        return;
      }

      if (isFalling) {
        playerGroup.position.y -= 0.35;
        playerGroup.position.z += speed;
        renderer.render(scene, camera);
        return;
      }

      animClock += 0.18;
      speed = Math.min(DIFFICULTY.maxSpeed, DIFFICULTY.baseSpeed + (distance / 12000));

      // 1. 每 1000m 里程碑奖励机制
      if (distance >= nextMilestone) {
        reviveCount++;
        document.getElementById('revive-text').innerText = reviveCount;
        playSfx('revive_reward');

        // 显示奖励横幅
        const banner = document.getElementById('milestone-banner');
        document.getElementById('milestone-m').innerText = nextMilestone;
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 2500);

        nextMilestone += 1000;
      }

      // 2. 无敌护盾计时
      if (isInvincible) {
        invincibleTimer--;
        reviveShield.material.opacity = 0.5 + Math.sin(animClock * 2.5) * 0.3;
        if (invincibleTimer <= 0) {
          isInvincible = false;
          reviveShield.material.opacity = 0;
        }
      }

      // 3. 转弯运镜
      if (turnTransition.active) {
        turnTransition.progress += 1 / turnTransition.duration;
        const t = turnTransition.progress;
        const ease = t * (2 - t);
        const dir = turnTransition.dir;

        playerGroup.rotation.y = -dir * (Math.PI / 2) * ease;
        playerGroup.rotation.z = -dir * 0.6 * Math.sin(t * Math.PI);
        playerGroup.position.x += dir * speed * 0.9;

        sparkMat.opacity = 0.9;
        const sArr = sparkGeo.attributes.position.array;
        for (let i = 0; i < sparkCount * 3; i += 3) {
          sArr[i] = playerGroup.position.x + (Math.random() - 0.5) * 0.8;
          sArr[i + 1] = 0.1 + Math.random() * 0.3;
          sArr[i + 2] = playerGroup.position.z + (Math.random() - 0.5) * 0.8;
        }
        sparkGeo.attributes.position.needsUpdate = true;

        const camOrbitRadius = 7.6;
        const camAngle = -dir * (Math.PI / 2) * ease;
        camera.position.x = playerGroup.position.x - Math.sin(camAngle) * camOrbitRadius * 0.4;
        camera.position.y = 4.8 + Math.sin(t * Math.PI) * 0.3;
        camera.position.z = playerGroup.position.z + Math.cos(camAngle) * camOrbitRadius;

        camera.rotation.y = -dir * (Math.PI / 2) * ease * 0.85;
        camera.rotation.z = -dir * 0.15 * Math.sin(t * Math.PI);

        camera.fov = 65 + Math.sin(t * Math.PI) * 12;
        camera.updateProjectionMatrix();

        zombieGroup.position.x += (playerGroup.position.x - zombieGroup.position.x) * 0.1;
        zombieGroup.rotation.y = -dir * (Math.PI / 2) * ease * 0.7;

        if (turnTransition.progress >= 1) {
          camera.fov = 65;
          camera.updateProjectionMatrix();
          finishSmoothTurn();
        }

        renderer.render(scene, camera);
        return;
      }

      // 4. 常规跑动与换道
      const targetX = LANES[currentLane];
      const deltaX = targetX - playerGroup.position.x;
      playerGroup.position.x += deltaX * 0.22;
      pTorso.rotation.z = -deltaX * 0.12;
      pTorso.rotation.y = deltaX * 0.08;

      if (!isJumping && !isSliding) {
        leftLeg.rotation.x = Math.sin(animClock) * 0.75;
        rightLeg.rotation.x = -Math.sin(animClock) * 0.75;
        leftArm.rotation.x = -Math.sin(animClock) * 0.65;
        rightArm.rotation.x = Math.sin(animClock) * 0.65;
        pTorso.position.y = 1.15 + Math.abs(Math.sin(animClock)) * 0.08;
      } else if (isSliding) {
        slideTimer--;
        pTorso.rotation.x = -1.1; pTorso.position.y = 0.55;
        leftLeg.rotation.x = -1.4; rightLeg.rotation.x = -1.2;
        leftArm.rotation.x = 0.8; rightArm.rotation.x = 0.8;
        if (slideTimer <= 0) {
          isSliding = false; pTorso.rotation.x = 0; pTorso.position.y = 1.15;
        }
      }

      if (isJumping) {
        playerGroup.position.y += jumpVelocity;
        jumpVelocity += gravity;
        leftLeg.rotation.x = 0.6; rightLeg.rotation.x = -0.3;
        if (playerGroup.position.y <= 0) {
          playerGroup.position.y = 0; isJumping = false; jumpVelocity = 0;
        }
      }

      // 5. 暴君丧尸跟随
      const zombieDist = Math.max(5.0, 6.5 - (distance / 2000));
      zombieGroup.position.x += (playerGroup.position.x - zombieGroup.position.x) * 0.14;
      zombieGroup.position.z = playerGroup.position.z + zombieDist;
      zombieGroup.position.y = Math.sin(animClock * 1.5) * 0.15;
      zLeftArm.rotation.x = -1.25 + Math.sin(animClock * 1.3) * 0.45;
      zRightArm.rotation.x = -1.25 - Math.sin(animClock * 1.3) * 0.45;

      turnGlowMeshes.forEach(mesh => {
        mesh.material.opacity = 0.6 + Math.sin(animClock * 2.0) * 0.4;
      });

      tracks.forEach(track => track.position.z += speed);
      obstacles.forEach(obs => {
        obs.position.z += speed;
        if (obs.userData.laser) obs.userData.laser.material.opacity = 0.5 + Math.sin(animClock * 2.0) * 0.4;
      });
      serums.forEach(s => {
        s.position.z += speed;
        s.rotation.y += 0.08;
      });

      distanceSinceLastTurn += speed;
      const upcomingTurn = tracks.find(t => t.userData.isTurnTrack && !t.userData.handled);
      const alertElem = document.getElementById('turn-alert');

      if (upcomingTurn && upcomingTurn.position.z < 0 && upcomingTurn.position.z > -32) {
        alertElem.style.display = 'block';
        alertElem.innerText = upcomingTurn.userData.turnDir === -1 ? '◀ 准备向左拐弯' : '准备向右拐弯 ▶';
      } else {
        alertElem.style.display = 'none';
      }

      if (tracks[0].position.z > 25) {
        const firstTrack = tracks.shift();
        const lastTrackZ = tracks[tracks.length - 1].position.z;
        scene.remove(firstTrack);

        const canSpawnTurn = distance > DIFFICULTY.turnUnlockDist && distanceSinceLastTurn > 350;
        const spawnTurn = canSpawnTurn && Math.random() < 0.35;
        createTrackPiece(lastTrackZ - TRACK_PIECE_LENGTH, spawnTurn);
      }

      const passedTurnTrack = tracks.find(t => t.userData.isTurnTrack && t.position.z > 8.0 && !t.userData.handled);
      if (passedTurnTrack) {
        triggerTurnFail("未及时拐弯，坠入深渊！");
        return;
      }

      // 6. 血清收集
      const playerPos = playerGroup.position;
      for (let i = serums.length - 1; i >= 0; i--) {
        const s = serums[i];
        if (s.position.z > 15) { scene.remove(s); serums.splice(i, 1); continue; }
        if (Math.abs(s.position.z - playerPos.z) < 1.4 && Math.abs(s.position.x - playerPos.x) < 1.1) {
          scene.remove(s); serums.splice(i, 1);
          serumCount++;
          playSfx('coin');
          document.getElementById('serum-text').innerText = serumCount;
        }
      }

      // 7. 障碍物碰撞检测（无敌保护中免疫伤害）
      if (!isInvincible) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          if (obs.position.z > 15) { scene.remove(obs); obstacles.splice(i, 1); continue; }

          if (obs.userData.type === 'low_obs') {
            if (
              Math.abs(obs.position.z - playerPos.z) < 0.95 &&
              Math.abs(obs.position.x - playerPos.x) < 0.90 &&
              playerPos.y < 0.80
            ) {
              playSfx('hit');
              handlePlayerDefeat("被生化油桶绊倒，被丧尸撕碎！");
              return;
            }
          } else if (obs.userData.type === 'high_obs') {
            if (Math.abs(obs.position.z - playerPos.z) < 0.95 && !isSliding) {
              playSfx('hit');
              handlePlayerDefeat("触碰高压激光切断！请下滑钻过");
              return;
            }
          }
        }
      }

      camera.position.set(playerGroup.position.x * 0.35, 4.8 + Math.sin(distance * 0.15) * 0.04, 7.6);
      camera.rotation.y = 0;
      camera.rotation.z = -deltaX * 0.04;
      camera.lookAt(playerGroup.position.x * 0.35, 1.4, -15);

      distance += speed;
      document.getElementById('score-text').innerText = Math.floor(distance);

      renderer.render(scene, camera);
    }

    function triggerGameOver(reason) {
      isGameOver = true;
      document.getElementById('over-reason').innerText = reason;
      document.getElementById('final-dist').innerText = Math.floor(distance);
      document.getElementById('final-serum').innerText = serumCount;
      document.getElementById('gameover').style.display = 'block';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    fetchCloudLeaderboard();
    animate();
  </script>
</body>
</html>
